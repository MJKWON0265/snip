<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폴더 연결 · snip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Tomorrow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 폴더 하나 / 드라이브 전체 고르는 두 칸 */
    .scope {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .scope label {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 22px;
      cursor: pointer;
    }
    .scope input { accent-color: var(--orange); width: 20px; height: 20px; margin-top: 3px; }
    .scope b { display: block; font-size: 18px; margin-bottom: 4px; }
    .scope span { font-size: 15px; color: var(--muted); }
    .scope label:has(input:checked) { border-color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange); }

    /* 폴더 목록 */
    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }
    .search input {
      flex: 1;
      height: 56px;
      border: none;
      background: transparent;
      font-family: var(--kr);
      font-size: 16px;
    }
    .search input:focus { outline: none; }
    .path {
      padding: 12px 20px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .folder-list { max-height: 360px; overflow-y: auto; }
    .folder {
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      font-family: var(--kr);
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      font-size: 17px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .folder:last-child { border-bottom: none; }
    .folder:hover { background: #fff; }
    [hidden] { display: none !important; }
    button.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .folder .icon {
      width: 22px;
      height: 17px;
      border: 2px solid var(--muted);
      border-radius: 3px;
    }
    .folder.selected { background: var(--orange-soft); font-weight: 700; }
    .folder.selected .icon { border-color: var(--orange); }
    .folder .pick {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--orange);
    }

    /* 문서 읽는 중 표시 */
    .progress {
      padding: 22px;
      border: 1px dashed var(--line);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .progress b { font-size: 16px; font-weight: 500; }
    .bar { height: 10px; background: #fff; border: 1px solid var(--line); }
    .bar div { width: 38%; height: 100%; background: var(--orange); }
    .progress span { font-size: 14px; color: var(--muted); }

    @media (max-width: 900px) {
      .scope { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html"><div class="logo-mark">S</div>snip</a>
    <div class="meta"><span id="user-name"></span> · <a href="index.html" id="logout">로그아웃</a></div>
  </header>

  <main class="frame">
    <div class="page">
      <div class="label"><span class="dot"></span>STEP 1 / 3 · 폴더 연결</div>
      <h1 class="page-title">참고할 기획안이 있는 곳을 골라 주세요</h1>

      <div class="scope">
        <label class="box">
          <input type="radio" name="scope" value="folder" checked>
          <div><b>폴더 하나 고르기 (추천)</b><span>빠르고 정확해요</span></div>
        </label>
        <label class="box">
          <input type="radio" name="scope" value="all">
          <div><b>드라이브 전체</b><span>최근 문서 30개까지만 읽어요</span></div>
        </label>
      </div>

      <div class="box" id="folder-box">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <span class="sr-only">폴더 이름 검색</span>
          <input type="text" id="folder-search" placeholder="폴더 이름으로 찾기 (예: 2025 기획안)">
        </label>
        <div class="path" id="folder-status">내 드라이브의 폴더를 불러오는 중이에요...</div>
        <div id="folder-list" class="folder-list"></div>
      </div>

      <div class="progress" id="progress" hidden>
        <b id="progress-text">문서 읽는 중...</b>
        <div class="bar"><div id="progress-bar"></div></div>
        <span id="progress-sub">구글 문서와 구글 프레젠테이션을 읽어요. 처음 한 번만 기다리면 돼요.</span>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="connect" disabled>이 폴더 읽어 오기</button>
        <a class="btn" href="upload.html" id="next" hidden>다음: 읽을 문서 넣기 →</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/google.js"></script>
  <script>
    const session = SnipGoogle.requireSession();
    if (session) document.getElementById('user-name').textContent = session.name + '님';
    document.getElementById('logout').addEventListener('click', () => SnipGoogle.signOut());

    const listEl = document.getElementById('folder-list');
    const statusEl = document.getElementById('folder-status');
    const searchEl = document.getElementById('folder-search');
    const connectBtn = document.getElementById('connect');
    const nextBtn = document.getElementById('next');
    let selected = null;

    function scope() {
      return document.querySelector('input[name="scope"]:checked').value;
    }

    function updateButton() {
      if (scope() === 'all') {
        connectBtn.textContent = '드라이브 전체 읽어 오기';
        connectBtn.disabled = false;
      } else {
        connectBtn.textContent = selected ? '"' + selected.name + '" 읽어 오기' : '폴더를 골라 주세요';
        connectBtn.disabled = !selected;
      }
    }

    // 폴더 목록을 그려요.
    async function loadFolders() {
      statusEl.textContent = '내 드라이브의 폴더를 불러오는 중이에요...';
      listEl.innerHTML = '';
      try {
        const folders = await SnipGoogle.listFolders(searchEl.value.trim());
        statusEl.textContent = folders.length
          ? '최근에 바뀐 순서로 보여드려요'
          : '폴더를 찾지 못했어요. 다른 이름으로 검색해 보세요.';
        folders.forEach((f) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'folder' + (selected && selected.id === f.id ? ' selected' : '');
          const icon = document.createElement('span');
          icon.className = 'icon';
          const name = document.createElement('span');
          name.textContent = f.name;
          btn.append(icon, name);
          btn.addEventListener('click', () => {
            selected = f;
            listEl.querySelectorAll('.folder').forEach((el) => el.classList.remove('selected'));
            btn.classList.add('selected');
            updateButton();
          });
          listEl.appendChild(btn);
        });
      } catch (e) {
        statusEl.textContent = e.message;
      }
    }

    let timer = null;
    searchEl.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(loadFolders, 400);
    });
    document.querySelectorAll('input[name="scope"]').forEach((r) =>
      r.addEventListener('change', () => {
        document.getElementById('folder-box').hidden = scope() === 'all';
        updateButton();
      }),
    );

    // 고른 곳의 문서를 하나씩 읽어 와요.
    connectBtn.addEventListener('click', async () => {
      const source = scope() === 'all'
        ? { folderId: null, label: '드라이브 전체 (최근 문서)' }
        : { folderId: selected.id, label: selected.name };
      const progress = document.getElementById('progress');
      const text = document.getElementById('progress-text');
      const bar = document.getElementById('progress-bar');
      progress.hidden = false;
      bar.style.width = '0%';
      connectBtn.disabled = true;
      nextBtn.hidden = true;
      try {
        const lib = await SnipGoogle.buildLibrary(source, (done, total, name) => {
          bar.style.width = total ? Math.round((done / total) * 100) + '%' : '100%';
          text.textContent = total
            ? '문서 읽는 중... ' + total + '개 중 ' + done + '개 완료' + (name ? ' · ' + name : '')
            : '읽을 문서를 찾는 중...';
        });
        if (!lib.docs.length) {
          text.textContent = '여기에는 읽을 수 있는 문서가 없어요. 구글 문서나 구글 프레젠테이션이 있는 폴더를 골라 주세요.';
          bar.style.width = '0%';
        } else {
          text.textContent = '완료! 문서 ' + lib.docs.length + '개를 읽었어요.' + (lib.skipped ? ' (' + lib.skipped + '개는 너무 크거나 읽지 못해 건너뛰었어요)' : '');
          nextBtn.hidden = false;
        }
      } catch (e) {
        text.textContent = e.message;
      } finally {
        updateButton();
      }
    });

    // 이미 읽어 둔 폴더가 있으면 바로 다음으로 갈 수 있게 해요.
    const existing = SnipGoogle.getLibrary();
    if (existing && existing.docs && existing.docs.length) {
      const progress = document.getElementById('progress');
      progress.hidden = false;
      document.getElementById('progress-bar').style.width = '100%';
      document.getElementById('progress-text').textContent =
        '이미 연결된 곳: ' + existing.source + ' (문서 ' + existing.docs.length + '개). 다시 고르면 새로 읽어 와요.';
      nextBtn.hidden = false;
    }

    if (session) loadFolders();
    updateButton();
  </script>

</body>
</html>
