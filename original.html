<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원본 보기 · snip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Tomorrow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="viewer.css">
  <style>
    /* 맨 위 줄: 돌아가기 + 파일 이름 + 드라이브에서 열기 */
    .bar-top {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .bar-top .back { font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap; }
    .bar-top .name { flex: 1; font-family: var(--mono); font-size: 15px; }
    .bar-top .btn { padding: 12px 18px; font-size: 13px; white-space: nowrap; }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      min-height: calc(100vh - 160px);
    }

    .doc {
      padding: 40px 64px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .doc .where { font-family: var(--mono); font-size: 13px; color: var(--muted); }

    /* 형광펜으로 칠해진 관련 부분 */
    .hit {
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hit small { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--accent-ink); }
    .hit p { font-size: 17px; line-height: 1.75; }

    /* 오른쪽: 이 파일 안의 관련 부분 목록 */
    .side {
      padding: 28px;
      background: #f3f3f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .side button {
      text-align: left;
      padding: 14px;
      background: #fff;
      border: 1px solid var(--line);
      font-family: var(--kr);
      font-size: 15px;
      cursor: pointer;
    }
    .side button.on { border: 2px solid var(--accent); }
    .side .quote {
      font-size: 15px;
      line-height: 1.7;
      background: #fff;
      border-left: 4px solid #ffc400;
      padding: 12px 14px;
      word-break: keep-all;
      max-height: 40vh;
      overflow: auto;
    }
    .side .note { font-size: 14px; line-height: 1.6; color: var(--muted); word-break: keep-all; }
    .doc .doc-body { display: flex; flex-direction: column; gap: 16px; }
    .doc .para { font-size: 17px; line-height: 1.85; color: var(--muted); word-break: keep-all; }
    .hit p { color: var(--ink); }
    [hidden] { display: none !important; }

    /* 스크롤해도 오른쪽 아래에 늘 떠 있는 "구글 드라이브에서 열기" 버튼 */
    .float-open {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 22px;
      font-size: 15px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    @media (max-width: 900px) {
      .bar-top { flex-wrap: wrap; padding: 14px 20px; }
      .bar-top .name { flex-basis: 100%; order: 3; }
      .split { grid-template-columns: 1fr; }
      .doc { padding: 32px 20px; border-right: none; border-bottom: 1px solid var(--line); }
      .float-open { right: 16px; bottom: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html"><div class="logo-mark">S</div>snip</a>
    <div class="meta">원본 보기</div>
  </header>

  <main class="frame">
    <div class="bar-top">
      <a class="back" href="reader.html" id="back">← 이 탭 닫고 읽던 문서로</a>
      <span class="name" id="file-name">2024 온보딩 개선안_v3.docx</span>
      <a class="btn btn-ghost" id="drive-link" href="https://drive.google.com" target="_blank" rel="noopener">구글 드라이브에서 열기</a>
    </div>

    <div class="split">
      <article class="doc">
        <span class="where" id="where">원본을 불러오는 중이에요...</span>
        <div class="pager" id="pager" hidden></div>
        <div id="doc" class="doc-body"></div>
      </article>

      <aside class="side">
        <div class="label">찾은 관련 부분</div>
        <blockquote class="quote" id="quote"></blockquote>
        <button type="button" id="go-hit" hidden>이 위치로 다시 가기</button>
        <p class="note" id="note"></p>
      </aside>
    </div>
  </main>

  <a class="btn float-open" id="float-open" href="https://drive.google.com" target="_blank" rel="noopener">구글 드라이브에서 원본 열기 ↗</a>

  <script src="js/config.js"></script>
  <script src="js/google.js"></script>
  <script src="js/files.js"></script>
  <script src="js/viewer.js"></script>
  <script>
    // 내 컴퓨터에서 올린 파일이면, 이 브라우저에 보관해 둔 원본 파일을 열 수 있게 해요.
    // PDF와 텍스트는 새 탭에서 바로 보이고, 워드(.docx)는 내려받아져서 워드로 열려요.
    async function openLocalOriginal(hit, buttons) {
      if (!hit.id || !hit.id.startsWith('local-')) return;
      let file = null;
      try { file = await SnipFiles.getOriginal(hit.id); } catch (e) {}
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      const blob = ext === 'txt' || ext === 'md'
        ? new Blob([file], { type: 'text/plain;charset=utf-8' })
        : file;
      const url = URL.createObjectURL(blob);
      buttons.forEach((b) => {
        b.href = url;
        b.textContent = '원본 파일 열기 ↗';
        if (ext !== 'pdf' && ext !== 'txt' && ext !== 'md') b.download = file.name;
        b.hidden = false;
      });
    }

    // 결과 카드에서 고른 부분을 받아와요.
    let hit = null;
    try { hit = JSON.parse(localStorage.getItem('snip-hit')); } catch (e) {}

    // 새 탭으로 열렸으면 이 탭만 닫아요. 읽던 문서는 원래 탭에 그대로 있어요.
    // (탭을 닫을 수 없는 경우엔 링크대로 읽기 화면으로 이동해요.)
    document.getElementById('back').addEventListener('click', (e) => {
      e.preventDefault();
      window.close();
      setTimeout(() => { location.href = 'reader.html'; }, 200);
    });

    const docEl = document.getElementById('doc');
    const whereEl = document.getElementById('where');
    const noteEl = document.getElementById('note');
    const goBtn = document.getElementById('go-hit');

    // 원본 파일을 구해요. 내 컴퓨터 파일은 이 브라우저에 보관해 둔 것을, 드라이브 문서는 PDF로 받아요.
    async function getOriginalFile() {
      if (!hit.id) return { why: '예시 문서는 원본 파일이 없어서 글자로 보여드려요.' };
      if (hit.id.startsWith('local-')) {
        let file = null;
        try { file = await SnipFiles.getOriginal(hit.id); } catch (e) {}
        return file ? { file } : { why: '이 브라우저에 원본 파일이 남아 있지 않아 글자로 보여드려요.' };
      }
      if (hit.id.startsWith('sample-')) return { why: '예시 문서는 원본 파일이 없어서 글자로 보여드려요.' };
      if (!SnipGoogle.getSession()) return { why: '구글 로그인이 끝나서 글자로 보여드려요. 읽기 화면에서 다시 로그인하면 원래 모양으로 볼 수 있어요.' };
      try {
        return { file: await SnipGoogle.downloadPdf({ id: hit.id, name: hit.file }) };
      } catch (e) {
        return { why: '드라이브에서 원본을 받지 못해 글자로 보여드려요. (' + e.message + ')' };
      }
    }

    // 원래 모양으로 그린 뒤, 관련 부분이 있는 쪽을 찾아 넘기고 형광펜으로 칠해요. (Ctrl+F 검색 결과처럼)
    async function showOriginal(file, target) {
      let lastMark = null;
      const scrollToMark = () => {
        if (!lastMark) return;
        const box = lastMark.getBoundingClientRect();
        window.scrollTo({ top: window.scrollY + box.top - window.innerHeight / 3, behavior: 'smooth' });
      };
      const viewer = await SnipViewer.render(file, docEl, document.getElementById('pager'), {
        onShow: () => { lastMark = SnipViewer.mark(docEl, target); },
      });
      if (!viewer) return false;
      const page = await SnipViewer.findPage(viewer, target);
      if (page > 1) await viewer.show(page);
      else lastMark = SnipViewer.mark(docEl, target);
      if (lastMark) {
        whereEl.textContent = (viewer.total > 1 ? page + '쪽 · ' : '') + '관련 부분을 노란 형광펜으로 칠해 뒀어요';
        goBtn.hidden = false;
        goBtn.textContent = viewer.total > 1 ? page + '쪽 관련 부분으로 다시 가기' : '관련 부분으로 다시 가기';
        goBtn.onclick = async () => {
          if (viewer.current() !== page) await viewer.show(page);
          scrollToMark();
        };
        setTimeout(scrollToMark, 200);
      } else {
        whereEl.textContent = '원본에서 정확한 위치를 찾지 못했어요. 오른쪽 관련 부분을 참고해 주세요.';
      }
      return true;
    }

    // 원본 파일이 없으면 예전처럼 문단을 글자로 늘어놓고 관련 문단을 칠해요.
    function showText() {
      docEl.innerHTML = '';
      let target = null;
      hit.paragraphs.forEach((text, i) => {
        if (i === hit.index) {
          const box = document.createElement('div');
          box.className = 'hit';
          const small = document.createElement('small');
          small.textContent = '관련 부분';
          const p = document.createElement('p');
          p.textContent = text;
          box.append(small, p);
          docEl.appendChild(box);
          target = box;
        } else {
          const p = document.createElement('p');
          p.className = 'para';
          p.textContent = text;
          docEl.appendChild(p);
        }
      });
      whereEl.textContent = '자동으로 관련 부분까지 내려왔어요';
      if (target) {
        goBtn.hidden = false;
        goBtn.textContent = '관련 부분으로 다시 가기';
        goBtn.onclick = () => target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
      }
    }

    (async () => {
      if (!hit || !Array.isArray(hit.paragraphs)) {
        whereEl.textContent = '보여줄 관련 부분이 없어요. 읽기 화면에서 카드의 "원본에서 이 부분 보기"를 눌러 주세요.';
        return;
      }
      document.getElementById('file-name').textContent = hit.file;
      const target = hit.paragraphs[hit.index] || hit.excerpt || '';
      document.getElementById('quote').textContent = target;
      // 위쪽 버튼과 오른쪽 아래 떠 있는 버튼은 같은 원본으로 이어져요.
      const openButtons = [document.getElementById('drive-link'), document.getElementById('float-open')];
      if (hit.link) {
        openButtons.forEach((b) => { b.href = hit.link; });
      } else {
        openButtons.forEach((b) => { b.hidden = true; });
        openLocalOriginal(hit, openButtons);
      }
      const got = await getOriginalFile();
      let shown = false;
      if (got.file) {
        try { shown = await showOriginal(got.file, target); } catch (e) { console.warn('원래 모양으로 그리지 못했어요', e); }
      }
      if (!shown) {
        showText();
        noteEl.textContent = got.why || '이 파일은 원래 모양으로 그리지 못해서 글자로 보여드려요.';
      } else {
        noteEl.textContent = '원본 문서를 원래 모양 그대로 보여드려요.' + (document.getElementById('pager').hidden ? '' : ' 다른 쪽도 넘겨 볼 수 있어요.');
      }
    })();
  </script>

</body>
</html>
