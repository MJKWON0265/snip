<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문서 넣기 · snip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Tomorrow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 파일 올리기 / 텍스트 붙여넣기 탭 */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      height: 52px;
      padding: 0 24px;
      border: none;
      background: none;
      font-family: var(--kr);
      font-size: 17px;
      color: var(--muted);
      cursor: pointer;
    }
    .tabs button.on {
      color: var(--ink);
      font-weight: 700;
      border-bottom: 3px solid var(--orange);
    }

    /* 파일을 끌어다 놓는 칸 */
    .drop {
      min-height: 280px;
      border: 1.5px dashed #a9a9a9;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 20px;
      text-align: center;
    }
    .drop .file-icon {
      width: 46px;
      height: 56px;
      border: 2px solid var(--ink);
      clip-path: polygon(0 0, 70% 0, 100% 25%, 100% 100%, 0 100%);
      position: relative;
    }
    .drop b { font-size: 19px; font-weight: 500; }
    .drop small { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .drop.over { border-color: var(--orange); background: var(--orange-soft); }
    .drop.ready { border-style: solid; border-color: var(--orange); }
    .drop small.error { color: #b3261e; }

    /* 텍스트 붙여넣기 칸 */
    .paste {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .paste textarea {
      width: 100%;
      min-height: 280px;
      padding: 20px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-family: var(--kr);
      font-size: 16px;
      line-height: 1.8;
      resize: vertical;
    }
    .paste textarea:focus { outline: none; border-color: var(--orange); }
    .paste small { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html"><div class="logo-mark">S</div>snip</a>
    <div class="meta">연결된 곳: <span id="source">없음</span> · <a href="folder.html">바꾸기</a></div>
  </header>

  <main class="frame">
    <div class="page">
      <div class="label"><span class="dot"></span>STEP 2 / 3 · 읽을 문서 넣기</div>
      <h1 class="page-title">지금 읽을 문서를 넣어 주세요</h1>
      <p class="page-sub">피드백 문서, 결재 문서처럼 지금 확인해야 하는 문서 하나면 돼요.</p>

      <div class="tabs">
        <button type="button" class="on" data-tab="drop">파일 올리기</button>
        <button type="button" data-tab="paste">텍스트 붙여넣기</button>
      </div>

      <div class="drop" id="drop">
        <div class="file-icon" aria-hidden="true"></div>
        <b id="drop-title">파일을 여기로 끌어다 놓거나</b>
        <button type="button" class="btn btn-ghost" id="pick">내 컴퓨터에서 고르기</button>
        <input type="file" id="file-input" accept=".docx,.pdf,.txt,.md" hidden>
        <small id="file-status">지원 형식: 워드(.docx), PDF, 텍스트(.txt)</small>
      </div>

      <div class="paste" id="paste" hidden>
        <label for="paste-text" class="sr-only">읽을 문서 내용</label>
        <textarea id="paste-text" placeholder="읽을 문서 내용을 여기에 붙여넣거나 직접 써 주세요."></textarea>
        <small id="count">0자</small>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" href="folder.html">← 이전</a>
        <a class="btn" href="reader.html" id="open">문서 열기 →</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/google.js"></script>
  <script>
    const lib = SnipGoogle.getLibrary();
    if (lib && lib.docs) document.getElementById('source').textContent = lib.source + ' (문서 ' + lib.docs.length + '개)';

    // 탭을 누르면 해당 칸만 보이게 바꿔요.
    const tabs = document.querySelectorAll('.tabs button');
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => {
          const on = t === tab;
          t.classList.toggle('on', on);
          document.getElementById(t.dataset.tab).hidden = !on;
        });
        if (tab.dataset.tab === 'paste') document.getElementById('paste-text').focus();
      });
    });

    // 붙여넣은 글자 수를 세어 보여줘요.
    const text = document.getElementById('paste-text');
    text.addEventListener('input', () => {
      document.getElementById('count').textContent = text.value.length.toLocaleString() + '자';
    });
    // "문서 열기"를 누르면 붙여넣은 글을 잠깐 저장해 두고 읽기 화면에서 꺼내 써요.
    document.getElementById('open').addEventListener('click', () => {
      const pasteOn = !document.getElementById('paste').hidden;
      const value = text.value.trim();
      try {
        if (!pasteOn && fileDoc) {
          sessionStorage.setItem('snip-doc', JSON.stringify(fileDoc));
        } else if (pasteOn && value) {
          const firstLine = value.split('\n')[0].trim();
          const title = firstLine.length > 30 ? firstLine.slice(0, 30) + '…' : firstLine;
          sessionStorage.setItem('snip-doc', JSON.stringify({ title, text: value }));
        } else {
          sessionStorage.removeItem('snip-doc');
        }
      } catch (e) {}
    });
    // ---------- 내 컴퓨터에서 파일 올리기 ----------
    // 파일은 서버로 보내지 않고, 이 브라우저 안에서 글자만 꺼내요.
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file-input');
    const fileStatus = document.getElementById('file-status');
    const dropTitle = document.getElementById('drop-title');
    let fileDoc = null;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) return resolve();
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('파일 읽기 도구를 불러오지 못했어요.'));
        document.head.appendChild(s);
      });
    }

    async function readDocx(file) {
      await loadScript('vendor/mammoth.browser.min.js');
      const result = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      return result.value;
    }

    async function readPdf(file) {
      await loadScript('vendor/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        // 같은 줄의 글자는 붙이고, 줄이 바뀌면 줄바꿈을 넣어요.
        let line = '';
        const lines = [];
        content.items.forEach((item) => {
          line += item.str;
          if (item.hasEOL) { lines.push(line); line = ''; }
        });
        if (line) lines.push(line);
        pages.push(lines.join('\n'));
      }
      return pages.join('\n\n');
    }

    async function handleFile(file) {
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      fileDoc = null;
      drop.classList.remove('ready');
      fileStatus.className = '';
      fileStatus.textContent = '"' + file.name + '" 읽는 중...';
      try {
        let text;
        if (ext === 'docx') text = await readDocx(file);
        else if (ext === 'pdf') text = await readPdf(file);
        else if (ext === 'txt' || ext === 'md') text = await file.text();
        else if (ext === 'doc' || ext === 'hwp') throw new Error('예전 워드(.doc)와 한글(.hwp)은 아직 못 읽어요. .docx나 PDF로 저장해서 올려 주세요.');
        else throw new Error('이 파일 형식은 아직 못 읽어요. 워드(.docx), PDF, 텍스트(.txt)를 올려 주세요.');

        text = (text || '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim();
        if (!text) throw new Error('파일에서 글자를 찾지 못했어요. 스캔한 이미지 PDF는 글자를 읽을 수 없어요.');
        if (text.length > 20000) throw new Error('문서가 너무 길어요(' + text.length.toLocaleString() + '자). 2만 자 이하로 나눠서 올려 주세요.');

        fileDoc = { title: file.name.replace(/\.[^.]+$/, ''), text, fromFile: true };
        drop.classList.add('ready');
        dropTitle.textContent = '✓ ' + file.name;
        fileStatus.textContent = text.length.toLocaleString() + '자를 읽었어요. 아래 "문서 열기"를 눌러 주세요.';
      } catch (e) {
        dropTitle.textContent = '파일을 여기로 끌어다 놓거나';
        fileStatus.className = 'error';
        fileStatus.textContent = e.message || '파일을 읽지 못했어요.';
      }
    }

    document.getElementById('pick').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('over');
      handleFile(e.dataTransfer.files[0]);
    });
  </script>

</body>
</html>
