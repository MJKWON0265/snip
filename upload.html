<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>읽을 문서 넣기 · snip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Tomorrow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 파일 올리기 / 텍스트 붙여넣기 탭 */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      height: 52px;
      padding: 0 24px;
      border: none;
      background: none;
      font-family: var(--kr);
      font-size: 17px;
      color: var(--muted);
      cursor: pointer;
    }
    .tabs button.on {
      color: var(--ink);
      font-weight: 700;
      border-bottom: 3px solid var(--orange);
    }

    /* 파일을 끌어다 놓는 칸 */
    .drop {
      min-height: 280px;
      border: 1.5px dashed #a9a9a9;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 20px;
      text-align: center;
    }
    .drop .file-icon {
      width: 46px;
      height: 56px;
      border: 2px solid var(--ink);
      clip-path: polygon(0 0, 70% 0, 100% 25%, 100% 100%, 0 100%);
      position: relative;
    }
    .drop b { font-size: 19px; font-weight: 500; }
    .drop small { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .drop.over { border-color: var(--orange); background: var(--orange-soft); }
    .drop.ready { border-style: solid; border-color: var(--orange); }
    .drop small.error { color: #b3261e; }

    /* 텍스트 붙여넣기 칸 */
    .paste {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .paste textarea {
      width: 100%;
      min-height: 280px;
      padding: 20px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-family: var(--kr);
      font-size: 16px;
      line-height: 1.8;
      resize: vertical;
    }
    .paste textarea:focus { outline: none; border-color: var(--orange); }
    .paste small { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html"><div class="logo-mark">S</div>snip</a>
    <div class="meta">로그인 없이 쓸 수 있어요</div>
  </header>

  <main class="frame">
    <div class="page">
      <div class="label"><span class="dot"></span>STEP 1 / 3 · 읽을 문서 넣기</div>
      <h1 class="page-title">지금 읽을 문서를 넣어 주세요</h1>
      <p class="page-sub">피드백 문서, 논문, 수업 자료처럼 지금 읽어야 하는 문서 하나면 돼요. 참고할 문서는 다음 단계에서 골라요.</p>

      <div class="tabs">
        <button type="button" class="on" data-tab="drop">파일 올리기</button>
        <button type="button" data-tab="paste">텍스트 붙여넣기</button>
      </div>

      <div class="drop" id="drop">
        <div class="file-icon" aria-hidden="true"></div>
        <b id="drop-title">파일을 여기로 끌어다 놓거나</b>
        <button type="button" class="btn btn-ghost" id="pick">내 컴퓨터에서 고르기</button>
        <input type="file" id="file-input" accept=".docx,.pdf,.pptx,.txt,.md" hidden>
        <small id="file-status">지원 형식: 워드(.docx), 파워포인트(.pptx), PDF, 텍스트(.txt)</small>
      </div>

      <div class="paste" id="paste" hidden>
        <label for="paste-text" class="sr-only">읽을 문서 내용</label>
        <textarea id="paste-text" placeholder="읽을 문서 내용을 여기에 붙여넣거나 직접 써 주세요."></textarea>
        <small id="count">0자</small>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" href="index.html">← 처음으로</a>
        <a class="btn" href="folder.html" id="open">다음: 참고할 문서 고르기 →</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/google.js"></script>
  <script src="js/files.js"></script>
  <script>

    // 탭을 누르면 해당 칸만 보이게 바꿔요.
    const tabs = document.querySelectorAll('.tabs button');
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => {
          const on = t === tab;
          t.classList.toggle('on', on);
          document.getElementById(t.dataset.tab).hidden = !on;
        });
        if (tab.dataset.tab === 'paste') document.getElementById('paste-text').focus();
      });
    });

    // 붙여넣은 글자 수를 세어 보여줘요.
    const text = document.getElementById('paste-text');
    text.addEventListener('input', () => {
      document.getElementById('count').textContent = text.value.length.toLocaleString() + '자';
    });
    // "다음"을 누르면 넣은 문서를 잠깐 저장해 두고, 참고할 문서를 고른 뒤 읽기 화면에서 꺼내 써요.
    // 아직 문서를 넣지 않았으면 다음으로 넘어가지 않아요.
    // 파일이면 원본도 보관해 두어서, 읽기 화면에서 원래 모양(쪽·슬라이드) 그대로 보여줘요.
    document.getElementById('open').addEventListener('click', async (e) => {
      const pasteOn = !document.getElementById('paste').hidden;
      const value = text.value.trim();
      try {
        // 새 문서로 시작하니 예전에 골라 둔 참고 문서는 지워요. (섞이지 않게)
        if ((!pasteOn && fileDoc) || (pasteOn && value)) SnipGoogle.clearLibrary();
        if (!pasteOn && fileDoc) {
          e.preventDefault();
          sessionStorage.setItem('snip-doc', JSON.stringify(fileDoc));
          try { await SnipFiles.saveReading(fileRaw); } catch (err) {}
          location.href = 'folder.html';
        } else if (pasteOn && value) {
          const firstLine = value.split('\n')[0].trim();
          const title = firstLine.length > 30 ? firstLine.slice(0, 30) + '…' : firstLine;
          sessionStorage.setItem('snip-doc', JSON.stringify({ title, text: value }));
        } else {
          e.preventDefault();
          fileStatus.className = 'error';
          fileStatus.textContent = '먼저 읽을 문서를 넣어 주세요.';
          if (pasteOn) text.placeholder = '먼저 읽을 문서 내용을 붙여넣어 주세요.';
          return;
        }
      } catch (err) {}
    });
    // ---------- 내 컴퓨터에서 파일 올리기 ----------
    // 파일은 서버로 보내지 않고, 이 브라우저 안에서 글자만 꺼내요.
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file-input');
    const fileStatus = document.getElementById('file-status');
    const dropTitle = document.getElementById('drop-title');
    let fileDoc = null;
    let fileRaw = null;

    async function handleFile(file) {
      if (!file) return;
      fileDoc = null;
      drop.classList.remove('ready');
      fileStatus.className = '';
      fileStatus.textContent = '"' + file.name + '" 읽는 중...';
      try {
        const text = await SnipFiles.readText(file);
        if (text.length > 300000) throw new Error('문서가 너무 길어요(' + text.length.toLocaleString() + '자). 나눠서 올려 주세요.');

        fileDoc = { title: file.name.replace(/\.[^.]+$/, ''), text, fromFile: true, fileName: file.name };
        fileRaw = file;
        drop.classList.add('ready');
        dropTitle.textContent = '✓ ' + file.name;
        fileStatus.textContent = text.length.toLocaleString() + '자를 읽었어요. 아래 "다음"을 눌러 주세요.';
      } catch (e) {
        dropTitle.textContent = '파일을 여기로 끌어다 놓거나';
        fileStatus.className = 'error';
        fileStatus.textContent = e.message || '파일을 읽지 못했어요.';
      }
    }

    document.getElementById('pick').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('over');
      handleFile(e.dataTransfer.files[0]);
    });
  </script>

</body>
</html>
